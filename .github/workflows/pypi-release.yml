name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      release_ref:
        description: Existing release tag ref, for example refs/tags/v0.1.0
        required: true
        type: string


jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    # Only publish on valid version tags
    if: >-
      (github.event_name == 'release' && startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')) ||
      (github.event_name == 'workflow_dispatch' && startsWith(inputs.release_ref, 'refs/tags/v') && contains(inputs.release_ref, '.'))

    environment:
      name: pypi

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_ref || github.ref }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Sync dependencies (including dev)
        run: uv sync --extra analysis --extra dev --extra geo --frozen

      - name: Lint
        run: uv run --no-sync --frozen ruff check .

      - name: Format check
        run: uv run --no-sync --frozen ruff format --check .

      - name: Test
        run: uv run --no-sync --frozen pytest -q

      - name: Build
        run: uv build

      - name: Check build artifacts
        run: uv run --no-sync --frozen twine check dist/*

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
