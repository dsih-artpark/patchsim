name: Publish to PyPI

on:
  release:
    types: [published]
  workflow_dispatch: {}


jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    # Only publish on valid version tags
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref, '.')

    environment:
      name: pypi

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Sync dependencies (including dev)
        run: uv sync --extra dev --frozen

      - name: Lint
        run: uv run --no-sync --frozen ruff check .

      - name: Format check
        run: uv run --no-sync --frozen ruff format --check .

      - name: Test
        run: uv run --no-sync --frozen pytest -q

      - name: Build
        run: uv build

      - name: Check build artifacts
        run: uv run --no-sync --frozen twine check dist/*

      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
