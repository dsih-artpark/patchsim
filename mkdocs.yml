
site_name: Compartmental Multi-Patch Simulation Framework
site_description: Documentation for a modular metapopulation simulation framework for multi-disease epidemiological modelling.
site_author: Shreya Mukherjee
site_url: https://dsih-artpark.github.io/patchsim/
repo_url: https://github.com/dsih-artpark/patchsim
repo_name: GitHub

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: ["src"]
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started: getting-started.md
  - Configuration: configuration.md
  - CLI Reference: cli-reference.md
  - Architecture: architecture.md
  - Mathematical Model: mathematical-model.md
  - Rate Multiplication: rate-multiplication.md
  - Simulation Workflow: simulation-workflow.md
  - Network Design: network-design.md
  - Results: results.md
extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/dsih-artpark/patchsim