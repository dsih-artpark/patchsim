
site_name: Compartmental Multi-Patch Simulation Framework
site_description: Documentation for modular metapopulation simulation framework for multi-disease epidemiological modelling.
site_author: Shreya Mukherjee
repo_url: https://github.com/dsih-artpark/patchsim
repo_name: GitHub

theme:
  name: material
  palette:
    # Light mode
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    # Dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: ["src/patchsim"]
          options:
            docstring_style: google
            show_source: true

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - attr_list
  - md_in_html

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - Core Modules:
      - Overview: core/overview.md
      - Model: core/model.md
      - Network: core/network.md
      - Patch: core/patch.md
      - Simulation: core/simulation.md
  - User Guide:
      - Configuration: guide/configuration.md
      - Running Simulations: guide/running.md
      - Output & Visualization: guide/output.md
  - API Reference:
      - api/index.md
  - Examples:
      - Basic SIR Model: examples/sir.md
      - Multi-Patch SEIR: examples/seir.md
  - Development:
      - Contributing: development/contributing.md
      - Future Extensions: development/roadmap.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/yourusername/yourrepo